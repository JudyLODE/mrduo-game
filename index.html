<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="偵探多叔">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>body{margin:0}</style>
<title>偵探多叔：台灣大搜查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&family=Fredoka:wght@500;600;700&family=LXGW+WenKai+TC:wght@700&display=swap">
<style>
/* Layout: full-screen iPad storybook game — HUD strip on top, illustrated scene filling the rest, dialogue box floating over the bottom. */
:root{
  --sky:#BFE6FF; --ink:#2A3557; --ink2:#5A6688; --paper:#FFFFFF; --paper2:#F2F6FF;
  --sun:#FFD15C; --sun-d:#E0A92A; --coral:#FF7E6B; --mint:#7ED9BF; --teal:#3FB8A6;
  --caramel:#C4884D; --grape:#7A5AD8; --line:#2A3557;
  --f-ui:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-en:"Fredoka","Avenir Next",system-ui,sans-serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC",serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#8FCFF2;color:var(--ink);font-family:var(--f-ui);font-size:18px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:4px solid var(--line);z-index:5;flex-wrap:wrap}
.hud .ch{font-weight:900;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:6px;background:var(--paper2);border:3px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:900;font-size:16px;white-space:nowrap}
.hearts span{font-size:18px;color:var(--coral)}
.hearts span.off{color:#C9D0E2}
.hbtn{background:var(--sun);border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:900;font-size:16px;box-shadow:0 3px 0 var(--line);min-height:40px}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.bone{display:inline-block;width:22px;height:12px;position:relative;vertical-align:middle}
.bone::before,.bone::after{content:"";position:absolute;top:0;width:12px;height:12px;border-radius:50%;background:#F4E2C0;box-shadow:0 0 0 2px var(--line), 0 0 0 0 transparent}
.bone::before{left:-2px}.bone::after{right:-2px}

/* Stage */
.stage{position:relative;min-height:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{cursor:pointer}
.spot .hit{fill:transparent}
.twinkle{animation:tw 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.bob{animation:bob 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{50%{transform:translateY(-8px)}}
.pulse-ring{animation:pr 1s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pr{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
.wiggle{animation:wg 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wg{0%,78%,100%{transform:rotate(0) scale(1)}84%{transform:rotate(-14deg) scale(1.15)}90%{transform:rotate(12deg) scale(1.15)}96%{transform:rotate(-6deg) scale(1.05)}}
.breathe{animation:br 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes br{50%{transform:scaleY(1.015)}}
.talking{animation:talk .35s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes talk{50%{transform:translateY(-6px) rotate(-1deg)}}

.taskpill{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.94);border:3px solid var(--line);border-radius:16px;padding:6px 14px;font-weight:900;font-size:16px;z-index:3;max-width:calc(100% - 32px)}
.taskpill small{display:block;font-weight:700;color:var(--ink2);font-size:14px}
.deduce{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:18px;z-index:3;background:var(--coral);color:#fff;border:4px solid var(--line);border-radius:22px;padding:14px 22px;font-size:22px;font-weight:900;box-shadow:0 5px 0 var(--line);animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}

/* Dialogue */
.dlg{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:14px;z-index:10;display:flex;gap:14px;align-items:flex-end;max-width:1000px;margin:0 auto;cursor:pointer}
.port{flex:none;width:132px;height:132px;border-radius:50%;background:var(--paper);border:4px solid var(--line);overflow:hidden;display:grid;place-items:center;box-shadow:0 5px 0 var(--line);position:relative;top:-6px}
.port img{width:118%;margin-top:22%;}
.port svg{width:100%;height:100%}
.port .me{font-size:52px;font-weight:900;color:var(--grape)}
.bubble{flex:1;min-width:0;background:var(--paper);border:4px solid var(--line);border-radius:24px;padding:16px 20px 16px;box-shadow:0 5px 0 var(--line);position:relative;min-height:120px}
.nametag{position:absolute;top:-20px;left:18px;background:var(--sun);border:3px solid var(--line);border-radius:999px;padding:1px 14px;font-weight:900;font-size:17px}
.nametag.x{background:var(--grape);color:#fff}
.dlg.sys .bubble{background:#FFF8E6}
.dlg.sys .port{display:none}
.dtext{font-size:23px;line-height:1.6;font-weight:700;min-height:2.2em;white-space:pre-line}
.dtext.en{font-family:var(--f-en);font-size:28px;font-weight:600;letter-spacing:.3px}
.dzh{color:var(--ink2);font-size:18px;margin-top:4px}
.dtools{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;align-items:center}
.tool{background:var(--paper2);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:900;min-height:38px}
.next{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:14px solid var(--coral);animation:nx .6s ease-in-out infinite alternate;margin-left:6px}
@keyframes nx{to{transform:translateY(5px)}}
.choices{position:absolute;left:0;right:0;bottom:178px;z-index:11;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px}
.choices button{width:min(620px,100%);background:var(--paper);border:4px solid var(--line);border-radius:20px;padding:12px 18px;font-size:21px;font-weight:900;box-shadow:0 5px 0 var(--line);text-align:left;display:flex;align-items:center;gap:12px;min-height:60px}
.choices button .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sun);border:3px solid var(--line);display:grid;place-items:center;font-size:17px}
.choices button.en{font-family:var(--f-en);font-weight:600;font-size:24px}
.choices button:disabled{opacity:.4}
.choices button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.choices.grid{flex-direction:row;flex-wrap:wrap;justify-content:center}
.choices.grid button{width:auto;min-width:150px;justify-content:center}

/* Modal + cards */
.modal{position:fixed;inset:0;z-index:30;background:rgba(30,40,70,.55);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--paper);border:4px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--line);width:min(980px,100%);max-height:100%;overflow:auto;padding:22px;animation:pop .3s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h3{margin:0 0 6px;font-size:26px;font-weight:900;text-wrap:balance}
.card .lead{margin:0 0 14px;color:var(--ink2);font-size:18px;line-height:1.6}
.btn{background:var(--sun);border:4px solid var(--line);border-radius:18px;padding:10px 22px;font-size:21px;font-weight:900;box-shadow:0 5px 0 var(--line);min-height:58px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn.c{background:var(--coral);color:#fff}
.btn.m{background:var(--mint)}
.btn.w{background:var(--paper)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fb{min-height:30px;font-weight:900;font-size:19px;margin-top:8px}
.fb.ok{color:#1E9C6B}.fb.no{color:#E0473C}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;border-radius:999px;padding:10px 22px;font-weight:900;font-size:19px;box-shadow:0 5px 16px rgba(0,0,0,.25);animation:toastIn .3s;max-width:calc(100% - 32px);text-align:center}
@keyframes toastIn{from{transform:translate(-50%,-20px);opacity:0}}

/* Title */
.title{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 70% 30%,#FFE9A8 0,#BFE6FF 45%,#8FCFF2 100%);display:flex;align-items:center;justify-content:center;gap:24px;padding:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;flex-wrap:wrap}
.title .hero{width:min(330px,40vw);filter:drop-shadow(0 12px 0 rgba(42,53,87,.18));animation:bob 2.4s ease-in-out infinite}
.tcard{background:var(--paper);border:5px solid var(--line);border-radius:32px;box-shadow:0 10px 0 var(--line);padding:26px 26px 22px;width:min(520px,100%)}
.tcard .eyebrow{display:inline-block;background:var(--grape);color:#fff;border-radius:999px;padding:3px 14px;font-weight:900;font-size:15px;letter-spacing:2px}
.tcard h1{margin:10px 0 2px;font-size:clamp(40px,6vw,58px);font-weight:900;line-height:1.05;letter-spacing:1px}
.tcard h1 b{color:var(--caramel)}
.tcard .sub{margin:0 0 16px;font-size:20px;font-weight:900;color:var(--ink2)}
.tcard label{font-weight:900;font-size:16px;color:var(--ink2)}
.tcard input{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:22px;font-weight:900;margin:6px 0 14px;padding:10px 14px;border:4px solid var(--line);border-radius:16px;-webkit-user-select:text;user-select:text;color:var(--ink);background:var(--paper2)}
.appbtn{margin-top:10px;display:inline-flex;align-items:center;gap:6px;background:var(--paper2);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:900;color:var(--ink);min-height:40px}
.appsteps{margin:0;padding-left:22px;line-height:1.8;font-size:18px}
.appsteps b{color:var(--grape)}
.tcard .src{font-size:13px;color:var(--ink2);margin:12px 0 0;line-height:1.6}

/* Chapter card */
.chap{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:rgba(42,53,87,.82);animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}}
.chap div{text-align:center;color:#fff}
.chap small{display:block;font-size:22px;font-weight:900;color:var(--sun);letter-spacing:6px}
.chap b{display:block;font-size:clamp(40px,7vw,72px);font-weight:900;margin:8px 0;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.chap span{font-size:20px;opacity:.9}

/* Letter */
.letter{width:min(620px,100%);background:#FFFDF6;border:4px solid var(--line);border-radius:10px;box-shadow:0 8px 0 var(--line);padding:26px 28px;position:relative;
  background-image:repeating-linear-gradient(transparent 0 46px,#E8E2F7 46px 48px);animation:pop .4s cubic-bezier(.3,1.6,.6,1)}
.letter .seal{position:absolute;top:-26px;right:24px;width:64px;height:64px;border-radius:50%;background:var(--grape);color:#fff;font-family:var(--f-en);font-size:34px;font-weight:700;display:grid;place-items:center;border:4px solid var(--line);transform:rotate(12deg)}
.letter p{font-family:var(--f-hand);font-size:25px;line-height:48px;margin:0;white-space:pre-line}

/* Math lock */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.story{background:var(--paper2);border:3px solid var(--line);border-radius:18px;padding:12px 16px;font-size:20px;font-weight:700;line-height:1.6}
.vf{display:grid;justify-content:center;font:700 44px/1.15 var(--f-en);margin:12px auto;background:#FFFDF2;border:3px solid var(--line);border-radius:18px;padding:10px 18px;width:fit-content;font-variant-numeric:tabular-nums}
.vc{text-align:center;min-width:1em;padding:0 4px;border-radius:8px}
.vc.cr{color:var(--coral);font-size:24px;line-height:1.6}
.vc.hl{background:#FFE48A}
.vc.rs{color:#2D6FD6}
.vl{border-top:5px solid var(--line);margin:4px 0}
.prompt{font-size:24px;font-weight:900;text-align:center}
.ans{font:700 42px var(--f-en);text-align:center;background:var(--paper2);border:3px solid var(--line);border-radius:16px;min-height:62px;margin:8px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pad button{background:var(--paper);border:3px solid var(--line);border-radius:16px;min-height:60px;font:700 30px var(--f-en);box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .ok{background:var(--mint);font-family:var(--f-ui);font-size:22px;font-weight:900}
.pad .del{font-family:var(--f-ui);font-size:19px;font-weight:900}
.locks{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.locks i{width:34px;height:34px;border-radius:10px;border:3px solid var(--line);background:#DDE3F2;display:grid;place-items:center;font-style:normal;font-size:18px}
.locks i.on{background:var(--sun)}

/* Hangman */
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.slot{width:58px;height:68px;border-bottom:6px solid var(--line);font:700 48px var(--f-en);display:grid;place-items:center;color:#2D6FD6}
.keys{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.keys button{min-height:52px;border:3px solid var(--line);border-radius:12px;background:var(--paper);font:700 26px var(--f-en);box-shadow:0 3px 0 var(--line)}
.keys button:disabled{opacity:.25;box-shadow:none}
.keys button.hit{background:var(--mint);opacity:1}
.wordpic{display:flex;align-items:center;gap:14px;background:var(--paper2);border:3px solid var(--line);border-radius:18px;padding:8px 14px}
.wordpic .emo{font-size:54px;line-height:1}

/* Sign / radicals / order */
.sign{background:#9A6337;border:4px solid var(--line);border-radius:16px;padding:20px 14px;box-shadow:inset 0 0 0 6px #7A4A26;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sign button{width:56px;height:64px;background:#FFF1D6;color:#3A2410;border-radius:10px;font:900 38px var(--f-hand);display:grid;place-items:center;border:2px solid #6B3F1D}
.sign button.p{background:transparent;border:0;color:#FFF1D6;width:20px;pointer-events:none}
.sign button.bad{background:#FFD2D8;color:#D7263D}
.sign button.fix{background:#C9F2DD;color:#16784E}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.opts button{width:92px;height:92px;border-radius:20px;background:var(--paper);border:4px solid var(--line);font:900 52px var(--f-hand);box-shadow:0 5px 0 var(--line)}
.explain{background:#EAFBF3;border:3px solid #1E9C6B;border-radius:16px;padding:12px 16px;line-height:1.7;margin-top:12px;font-size:18px}
.chest{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.piece-row{display:flex;gap:10px;flex-wrap:wrap}
.piece-row button{width:76px;height:76px;border-radius:18px;border:4px solid var(--line);background:var(--paper);font:900 42px var(--f-hand);box-shadow:0 4px 0 var(--line)}
.piece-row button[aria-pressed="true"]{background:var(--sun)}
.bigchar{width:120px;height:120px;border-radius:24px;border:4px dashed var(--line);display:grid;place-items:center;font:900 72px var(--f-hand);background:#FFFDF2}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:66px;padding:10px;border:3px dashed var(--line);border-radius:16px;background:var(--paper2);margin:8px 0}
.chips button{background:#FFF1C9;border:3px solid var(--line);border-radius:14px;padding:8px 14px;font-size:22px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.chips.src button{background:var(--paper)}

/* Notebook */
.nb h4{margin:14px 0 6px;font-size:20px}
.nb ul{margin:0;padding-left:22px;line-height:1.8;font-size:18px}
.nb .empty{color:var(--ink2)}

/* Cert */
.cert{text-align:center}
.cert .stars{font-size:52px;color:var(--sun-d);letter-spacing:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:var(--paper2);border:3px solid var(--line);border-radius:16px;padding:10px}
.stats b{display:block;font:700 30px var(--f-en)}

@media (max-width:760px){
  .mgrid{grid-template-columns:1fr}
  .port{width:84px;height:84px}
  .dtext{font-size:19px}.dtext.en{font-size:22px}
  .choices{bottom:150px}
  .choices button{font-size:18px}
  .keys{grid-template-columns:repeat(7,1fr)}
  .hud .ch{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <div class="hud">
    <div class="ch" id="hudCh">偵探多叔事務所</div>
    <div class="pill hearts" id="hudHearts" title="推理力"></div>
    <div class="pill"><span class="bone" aria-hidden="true"></span>&nbsp;<span id="hudBones">0</span>/9</div>
    <button class="hbtn" id="nbBtn">偵探筆記</button>
  </div>
  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet"><g id="bgL"></g><g id="spotL"></g><g id="fxL"></g></svg>
    <div class="taskpill" id="taskPill" hidden></div>
    <button class="deduce" id="deduceBtn" hidden>開始推理！</button>
    <div class="choices" id="choices" hidden></div>
    <div class="dlg" id="dlg" hidden>
      <div class="port" id="dPort"></div>
      <div class="bubble">
        <div class="nametag" id="dName"></div>
        <div class="dtext" id="dText"></div>
        <div class="dzh" id="dZh" hidden></div>
        <div class="dtools"><button class="tool" id="dZhBtn" hidden>看中文</button><button class="tool" id="dSay">唸給我聽</button><div class="next" id="dNext" hidden></div></div>
      </div>
    </div>
  </div>

const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ================= state ================= */
const KEY='duoshu-case1-v2';
let G={name:'',level:'hard',energy:5,badges:[],quests:[],clues:[],facts:[],ch:0};
const hard=()=>true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');return v&&typeof v.ch==='number'?v:null}catch(e){return null}}
const fmt=t=>t.replace(/\{n\}/g,G.name||'助手');

/* ================= sound & voice ================= */
let ac=null;
function tone(fs,d=.11,type='triangle',v=.16){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.03)})}catch(e){}}
const sGood=()=>tone([660,880,1320]),sBad=()=>tone([240,190],.14,'square',.08),sWin=()=>tone([523,659,784,1047,1319],.12),sPop=()=>tone([880],.06,'sine',.12),sBell=()=>tone([1320,990],.35,'sine',.14);
function speak(t,lang){try{const u=new SpeechSynthesisUtterance(t.replace(/[「」『』]/g,''));u.lang=lang;u.rate=lang==='en-US'?.78:.95;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function shush(){try{speechSynthesis.cancel()}catch(e){}}
function toast(t,ms=1800){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
function shake(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

/* ================= HUD ================= */
function hud(){
  $('#hudHearts').innerHTML='推理力 '+[0,1,2,3,4].map(i=>`<span class="${i<G.energy?'':'off'}">♥</span>`).join('');
  $('#hudBones').textContent=G.badges.length;
}
function setCh(t){$('#hudCh').textContent=t}

function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=p<0?0:255,a=Math.abs(p)/100;r=Math.round((f-r)*a+r);g=Math.round((f-g)*a+g);b=Math.round((f-b)*a+b);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

/* ================= dialogue ================= */
let typingT=null;
function portrait(who){
  if(who==='duo')return `<img src="${IMG.face}" alt="">`;
  if(who==='me')return `<div class="me">${(G.name||'我').slice(0,1)}</div>`;
  const c=CAST[who];return c&&c.look?head(c.look):'';
}
function showLine(who,text,o={}){
  return new Promise(res=>{
    const box=$('#dlg');box.hidden=false;box.className='dlg'+(who==='sys'?' sys':'');
    $('#dPort').innerHTML=portrait(who);
    const nm=$('#dName');nm.hidden=who==='sys';nm.textContent=who==='me'?(G.name||'助手'):(CAST[who]?CAST[who].name:'');nm.className='nametag'+(CAST[who]&&CAST[who].cls?' x':'');
    const t=fmt(text),el=$('#dText');el.textContent='';el.className='dtext'+(o.en?' en':'');
    $('#dZh').hidden=true;$('#dZh').textContent=o.zh?fmt(o.zh):'';$('#dZhBtn').hidden=!o.zh;$('#dZhBtn').textContent='看中文';
    $('#dZhBtn').onclick=e=>{e.stopPropagation();const z=$('#dZh');z.hidden=!z.hidden;$('#dZhBtn').textContent=z.hidden?'看中文':'收起中文'};
    $('#dSay').onclick=e=>{e.stopPropagation();speak(t,o.en?'en-US':'zh-TW')};
    if(o.en)speak(t,'en-US');
    talkAnim(who,true);
    let i=0,done=false;$('#dNext').hidden=true;
    const fin=()=>{done=true;clearTimeout(typingT);el.textContent=t;talkAnim(who,false);res({box,isDone:()=>done})};
    const step=()=>{i+=1;el.textContent=t.slice(0,i);if(i%3===0)tone([o.en?520:440+((i*37)%120)],.03,'sine',.035);if(i<t.length)typingT=setTimeout(step,o.en?30:26);else fin()};
    box.onclick=()=>{if(!done)fin()};
    step();
  });
}
function say(who,text,o={}){
  return showLine(who,text,o).then(({box})=>new Promise(res=>{
    $('#dNext').hidden=false;
    box.onclick=()=>{box.onclick=null;$('#dNext').hidden=true;sPop();res()};
  }));
}
function hideDlg(){$('#dlg').hidden=true;$('#choices').hidden=true;shush()}
async function ask(who,text,opts,correct,o={}){
  await showLine(who,text,o);
  $('#dlg').onclick=null;
  return new Promise(res=>{
    const c=$('#choices');c.className='choices'+(o.grid?' grid':'');c.hidden=false;
    c.innerHTML=opts.map((t,i)=>`<button data-i="${i}" class="${o.enOpts?'en':''}"${o.colors?` style="background:${o.colors[i]};color:${o.dark&&o.dark[i]?'#fff':'inherit'}"`:''}><span class="k">${'ABCD'[i]}</span>${t}</button>`).join('');
    c.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const i=+b.dataset.i;
      if(o.enOpts)speak(opts[i].replace(/<[^>]+>/g,''),'en-US');
      if(correct==null||i===correct){c.hidden=true;c.onclick=null;if(correct!=null)sGood();res(i)}
      else{sBad();shake(b);b.disabled=true;if(o.scored){G.energy=Math.max(1,G.energy-1);hud();toast('推理力 −1　'+(o.wrong||'再想想看！'))}else toast(o.wrong||'再想想看！')}};
  });
}

/* ================= scene engine ================= */
let SC=null,busy=false;
const bone=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="-14" cy="-6" r="9" fill="#F7E6C4" stroke="#2A3557" stroke-width="3"/><circle cx="-14" cy="6" r="9" fill="#F7E6C4" stroke="#2A3557" stroke-width="3"/><circle cx="14" cy="-6" r="9" fill="#F7E6C4" stroke="#2A3557" stroke-width="3"/><circle cx="14" cy="6" r="9" fill="#F7E6C4" stroke="#2A3557" stroke-width="3"/><rect x="-14" y="-6" width="28" height="12" fill="#F7E6C4"/><path d="M-14 -6 H14 M-14 6 H14" stroke="#2A3557" stroke-width="3"/></g>`;
const star=(x,y,r=24)=>`<path class="twinkle" d="M${x} ${y-r} L${x+r*.28} ${y-r*.28} L${x+r} ${y} L${x+r*.28} ${y+r*.28} L${x} ${y+r} L${x-r*.28} ${y+r*.28} L${x-r} ${y} L${x-r*.28} ${y-r*.28}Z" fill="#FFF6B0" stroke="#E0A92A" stroke-width="2"/>`;
function duoImg(x,y,h){const w=h*447/665;return `<g class="spot" data-id="__duo"><image href="${IMG.front}" x="${x-w/2}" y="${y-h}" width="${w}" height="${h}" class="breathe"/><rect class="hit" x="${x-w/2}" y="${y-h}" width="${w}" height="${h}"/></g>`}
function spotSvg(sp){
  if(sp.hidden||(sp.type==='badge'&&sp.got))return '';
  let s=`<g class="spot" data-id="${sp.id}">`;
  if(sp.type==='npc'){
    const sc=sp.s||1;s+=`<g data-actor="${sp.actor||sp.id}"><g transform="translate(${sp.x} ${sp.y}) scale(${sc})"><g class="breathe">${critter(CAST[sp.actor||sp.id].look)}</g></g></g>`;
    s+=`<rect class="hit" x="${sp.x-70*sc}" y="${sp.y-240*sc}" width="${140*sc}" height="${245*sc}"/>`;
    const mk=!sp.done&&sp.need?'!':(sp.quest&&!sp.qdone?'?':'');
    if(mk)s+=`<g transform="translate(${sp.x+40*sc} ${sp.y-250*sc})"><g class="bob"><circle r="24" fill="${mk==='!'?'#FFD15C':'#8FD3FF'}" stroke="#2A3557" stroke-width="4"/><text y="10" text-anchor="middle" font-size="30" font-weight="900" fill="#2A3557" font-family="Fredoka,sans-serif">${mk}</text></g></g>`;
  }else if(sp.type==='badge'){
    s+=`<g class="wiggle"><circle cx="${sp.x}" cy="${sp.y}" r="34" fill="#FFF6B0" opacity=".55"/>${bone(sp.x,sp.y,sp.s||1.3)}</g><circle class="hit" cx="${sp.x}" cy="${sp.y}" r="50"/>`;
  }else{
    s+=(sp.art?sp.art():'')+`<circle class="hit" cx="${sp.x}" cy="${sp.y}" r="${sp.r||60}"/>`;
    if(sp.need&&!sp.done)s+=star(sp.x+(sp.sx||30),sp.y-(sp.sy||30));
    if(sp.done&&sp.need)s+=`<g transform="translate(${sp.x+(sp.sx||30)} ${sp.y-(sp.sy||30)})"><circle r="17" fill="#3FB8A6" stroke="#fff" stroke-width="3"/><path d="M-7 0 l5 5 l9 -10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>`;
  }
  return s+'</g>';
}
function drawSpots(){if(!SC)return;$('#spotL').innerHTML=(SC.duo?duoImg(...SC.duo):'')+SC.spots.map(spotSvg).join('');updateTask()}
function setScene(def){SC=def;$('#bgL').innerHTML=def.bg();$('#fxL').innerHTML='';$('#stage').style.background=def.color||'#BFE6FF';drawSpots()}
function spot(id){return SC.spots.find(s=>s.id===id)}
function updateTask(){
  const p=$('#taskPill');if(!SC||!SC.inv){p.hidden=true;$('#deduceBtn').hidden=true;return}
  const need=SC.spots.filter(s=>s.need),d=need.filter(s=>s.done).length;
  const bs=SC.spots.filter(s=>s.type==='badge'),bg=bs.filter(s=>s.got).length;
  p.hidden=false;p.innerHTML=`${SC.inv.title}　線索 ${d}/${need.length}${bs.length?`　｜　骨頭徽章 ${bg}/${bs.length}`:''}<small>${d<need.length?'點人物問話、點閃閃發光的地方調查':(bs.length&&bg<bs.length?'線索齊了！推理前，還可以找找會搖來搖去的骨頭徽章':'線索齊了！可以開始推理')}</small>`;
  $('#deduceBtn').hidden=!(d===need.length&&SC.inv.button);
}
$('#scene').addEventListener('click',async e=>{
  const g=e.target.closest('.spot');if(!g||busy||!SC)return;
  const id=g.dataset.id;
  if(SC.mode){SC.mode(id,g);return}
  if(!SC.inv)return;
  busy=true;$('#deduceBtn').hidden=true;
  try{
    if(id==='__duo')await duoHint();
    else{const sp=spot(id);
      if(sp.type==='badge'){sp.got=true;if(!G.badges.includes(sp.bid)){G.badges.push(sp.bid);save()}hud();sWin();toast('找到骨頭徽章！（'+G.badges.length+'/9）');drawSpots()}
      else if(sp.tap){await sp.tap(sp);hideDlg()}
    }
  }finally{busy=false;drawSpots();checkInv()}
});
let invResolve=null;
function investigate(title,{button=true}={}){SC.inv={title,button};drawSpots();return new Promise(r=>{invResolve=r;checkInv()})}
function checkInv(){if(!SC||!SC.inv||!invResolve)return;const need=SC.spots.filter(s=>s.need);
  if(need.every(s=>s.done)&&!SC.inv.button){const r=invResolve;invResolve=null;SC.inv=null;updateTask();r()}}
$('#deduceBtn').onclick=()=>{if(busy||!invResolve)return;const r=invResolve;invResolve=null;SC.inv=null;updateTask();r()};
async function duoHint(){
  const left=SC.spots.filter(s=>s.need&&!s.done);
  if(!left.length){const bl=SC.spots.filter(s=>s.type==='badge'&&!s.got);
    if(!bl.length){await say('duo','線索和骨頭徽章都找齊了，太厲害了！按右下角的「開始推理」吧。');return}
    await say('duo',`線索都找齊了！現場還藏著 ${bl.length} 個骨頭徽章，它們會偷偷搖來搖去。我幫你圈出一個！`);
    ring(bl[0].x,bl[0].y);return}
  const t=left[0];
  await say('duo',t.hint||'嗯……那邊好像還有線索，我們過去看看。');
  ring(t.x,t.type==='npc'?t.y-120*(t.s||1):t.y);
}

async function actorIn(id,look,x,y,s=1){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('data-actor',id);g.innerHTML=`<g transform="translate(${x} ${y}) scale(${s})"><g class="breathe">${critter(look)}</g></g>`;g.style.transition='transform .6s';g.style.transform='translateY(-400px)';$('#spotL').appendChild(g);await sleep(30);g.style.transform='none';await sleep(600);return g}
async function actorOut(g,dx=0,dy=-700){g.style.transition='transform 1.2s ease-in';g.style.transform=`translate(${dx}px,${dy}px)`;await sleep(1200);g.remove()}

const PN=['個位','十位','百位','千位'];
function mathLock(probs){
  return new Promise(res=>{
    let pi=0;
    modal(`<div class="card"><div class="row" style="justify-content:space-between"><h3>電梯密碼鎖</h3><div class="locks" id="lk">${probs.map(()=>'<i>🔒</i>').join('')}</div></div>

      <div><div class="prompt" id="mPrompt"></div><div class="ans" id="mAns"></div><div class="pad" id="mPad"></div><div class="fb" id="mFb"></div></div></div></div>`,b=>{
      const q=s=>b.querySelector(s);
      q('#mPad').innerHTML=['7','8','9','4','5','6','1','2','3','del','0','ok'].map(k=>`<button data-k="${k}" class="${k==='ok'?'ok':k==='del'?'del':''}">${k==='del'?'刪除':k==='ok'?'確定':k}</button>`).join('');
      let a,bb,ds,i,c,resd,car,val='',miss=0,N;
      function start(){const p=probs[pi];a=p.a;bb=p.b;ds=String(a).split('').reverse().map(Number);i=0;c=0;resd=[];car=[];miss=0;N=String(a*bb).length;
        q('#mStory').innerHTML=fmt(p.q);render()}
      function vf(){const cell=(t,cl='')=>`<span class="vc ${cl}">${t}</span>`;let h=`<div class="vf" style="grid-template-columns:repeat(${N+1},1.2em)">`;
        h+=cell('');for(let p=N-1;p>=0;p--)h+=cell(car[p]||'','cr');
        h+=cell('');for(let p=N-1;p>=0;p--)h+=cell(ds[p]!==undefined?ds[p]:'',p===i?'hl':'');
        h+=cell('×');for(let p=N-1;p>=0;p--)h+=cell(p===0?bb:'');
        h+='<span class="vl" style="grid-column:1/-1"></span>';
        h+=cell('');for(let p=N-1;p>=0;p--)h+=cell(resd[p]!==undefined?resd[p]:'','rs'+(p===i?' hl':''));return h+'</div>'}
      function render(){q('#mVf').innerHTML=vf();val='';q('#mAns').textContent='';
        if(i<ds.length){const d=ds[i];q('#mPrompt').innerHTML=`${PN[i]}：${d} × ${bb}${c?` ＋ 進位 ${c}`:''} ＝ ？`}
        q('#mFb').textContent='';q('#mFb').className='fb'}
      function check(){if(val==='')return;const d=ds[i],want=d*bb+c;
        if(+val===want){sGood();const last=i===ds.length-1;
          if(last){String(want).split('').reverse().forEach((x,j)=>resd[i+j]=x)}else{resd[i]=String(want%10);c=Math.floor(want/10);if(c)car[i+1]=c}
          if(!last&&want<10)c=0;
          i++;miss=0;
          if(i>=ds.length){q('#mVf').innerHTML=vf();q('#mPrompt').innerHTML=`答案：${a} × ${bb} ＝ <span style="color:#2D6FD6">${a*bb}</span>`;q('#mAns').textContent='';
            q('#mFb').textContent='密碼正確！';q('#mFb').className='fb ok';q('#lk').children[pi].className='on';q('#lk').children[pi].textContent='🔓';sWin();
            setTimeout(()=>{pi++;if(pi<probs.length)start();else{closeModal();res()}},1600)}
          else{render();if(c){q('#mFb').textContent=`滿十進位！把 ${c} 寫到${PN[i]}上面。`;q('#mFb').className='fb ok'}}}
        else{sBad();miss++;shake(q('#mAns'));val='';q('#mAns').textContent='';
          q('#mFb').textContent=miss===1?`再算一次：先想 ${ds[i]} × ${bb} 是多少${c?`，再加上進位的 ${c}`:''}。`:`提示：${ds[i]} × ${bb} ＝ ${ds[i]*bb}${c?`，${ds[i]*bb} ＋ ${c} ＝ ？`:''}`;q('#mFb').className='fb no'}}
      q('#mPad').onclick=e=>{const k=e.target.closest('button');if(!k)return;const v=k.dataset.k;
        if(v==='ok')return check();if(v==='del')val=val.slice(0,-1);else if(val.length<3)val+=v;tone([520],.04,'sine',.08);q('#mAns').textContent=val};
      start();
    });
  });
}

/* ================= MINIGAME: sentence order ================= */
function order(sents){
  return new Promise(res=>{
    let si=0;
    modal(`<div class="card" style="width:min(820px,100%)"><h3>撕碎的紙條</h3><p class="lead">紙條被撕成好幾片了。依照順序點一點，把句子拼回來！</p>
     <div class="chips" id="oA"></div><div class="chips src" id="oS"></div>
     <div class="row"><button class="btn w" id="oR">重來</button><button class="btn m" id="oC">拼好了</button></div><div class="fb" id="oF"></div></div>`,b=>{
      const q=s=>b.querySelector(s);let picked=[];
      function start(){picked=[];render()}
      function render(){const s=sents[si];q('#oA').innerHTML=picked.map(i=>`<button>${s[i]}</button>`).join('');
        q('#oS').innerHTML=shuffle(s.map((_,i)=>i)).filter(i=>!picked.includes(i)).map(i=>`<button data-i="${i}">${s[i]}</button>`).join('')}
      q('#oS').onclick=e=>{const k=e.target.closest('button');if(!k)return;sPop();picked.push(+k.dataset.i);render()};
      q('#oR').onclick=start;
      q('#oC').onclick=()=>{const s=sents[si];if(picked.length<s.length){q('#oF').textContent='還有紙片沒用到喔！';q('#oF').className='fb no';return}
        if(picked.every((v,i)=>v===i)){sWin();q('#oF').textContent='「'+s.join('')+'」';q('#oF').className='fb ok';si++;setTimeout(()=>{if(si<sents.length){q('#oF').textContent='';start()}else{closeModal();res()}},2000)}
        else{sBad();q('#oF').textContent='順序怪怪的，唸唸看通不通順？';q('#oF').className='fb no';shake(q('#oA'))}};
      start();
    });
  });
}

function listenHunt(list){
  return new Promise(res=>{
    let k=0,shown=false;
    const bar=document.createElement('div');bar.className='taskpill';bar.style.cssText='left:50%;transform:translateX(-50%);top:12px;display:flex;gap:10px;align-items:center;z-index:12;font-size:20px';
    $('#stage').appendChild(bar);$('#taskPill').hidden=true;
    const sentence=()=>`Find the ${list[k]}.`;
    function ui(){bar.innerHTML=`<span>聽英文，點出來（${k+1}/${list.length}）</span><button class="tool" id="lhP">再聽一次</button><button class="tool" id="lhT">${shown?sentence():'看英文'}</button>`;
      bar.querySelector('#lhP').onclick=()=>speak(sentence(),'en-US');bar.querySelector('#lhT').onclick=()=>{shown=true;ui()};speak(sentence(),'en-US')}
    ui();
    SC.mode=(id)=>{
      if(id===list[k]){sGood();const sp=spot(id);$('#fxL').innerHTML+=`<circle cx="${sp.x}" cy="${sp.y-10}" r="70" fill="none" stroke="#3FB8A6" stroke-width="10"/>`;speak(`${id}!`,'en-US');k++;shown=false;
        if(k>=list.length){SC.mode=null;bar.remove();setTimeout(()=>{$('#fxL').innerHTML='';res()},900)}else setTimeout(ui,900)}
      else{sBad();const nm={swan:'天鵝 swan',snail:'蝸牛 snail',snake:'蛇 snake',sloth:'樹懶 sloth'}[id];toast(nm?`這是 ${nm}，再聽一次！`:'不是這個，再聽一次！');if(nm)speak(id,'en-US')}
    };
  });
}

function multiPick(text,opts,ans){

    draw();
    c.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.ok){if(sel.size!==3){toast('要選 3 個喔！');return}
        if(ans.every(a=>sel.has(a))){sGood();c.hidden=true;c.onclick=null;res()}
        else{sBad();G.energy=Math.max(1,G.energy-1);hud();toast('推理力 −1　有的特徵不對，打開偵探筆記看看！');sel.clear();draw()}return}
      const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);sPop();draw()};
  });
}

/* ================= FINALE ================= */
const CROWD=[
 ['cat','r',1,'s'],['rabbit','b',1,'o'],['fox','n',1,'o'],['monkey','r',0,'o'],
 ['pig','y',1,'o'],['bear2','b',0,'n'],['sheep','r',1,'n'],['cat2','y',0,'s'],
 ['fox','r',1,'o'],['deer','b',1,'s'],['rabbit','n',0,'o'],['pig','r',0,'s'],
 ['monkey','y',1,'n'],['bear2','b',0,'o'],['fox','r',0,'n'],['sheep','n',1,'s']
];
const SHIRTS=['#7ED9BF','#C9B4F0','#FFB347','#9CCDF2','#FF9FB0','#A9D7A8','#FFD15C','#B9C2D2'];
async function finale(){
  G.ch=4;save();setCh('最終章　抓住怪盜X！');
  const pos=[];for(let r=0;r<2;r++)for(let c=0;c<8;c++)pos.push([110+c*196+(r?98:0)-(r?40:0),r?960:720]);
  setScene({id:'street',color:'#FFE6C2',bg:bgStreet,spots:CROWD.map((a,i)=>({id:'p'+i,type:'crowd',x:pos[i][0],y:pos[i][1],a,art:()=>`<g transform="translate(${pos[i][0]} ${pos[i][1]}) scale(${i>=8?1.05:.9})">${critter({k:a[0],shirt:SHIRTS[i%8],hat:a[1]!=='n'?{t:'cap',c:HATC[a[1]]}:null,glasses:a[2],bag:a[3]==='n'?null:a[3]})}</g>`,r:90}))});
  // crowd hit areas are drawn by generic thing renderer
  SC.spots.forEach(s=>{s.type='thing';s.y2=s.y;s.y=s.y-110});
  drawSpots();
  await chapterCard('最終章','抓住怪盜X！','台南・安平老街');
  await say('duo','好多人啊……怪盜X一定就混在裡面。');
  await say('duo','{n}，記住三個特徵：戴眼鏡、紅色帽子、圓形包包。找到他就點下去！');
  hideDlg();
  const bar=$('#taskPill');bar.hidden=false;bar.innerHTML='找出怪盜X！<small>特徵：戴眼鏡＋紅色帽子＋圓形包包</small>';
  await new Promise(res=>{
    SC.mode=(id,g)=>{const i=+id.slice(1),[k,h,gl,bg]=CROWD[i];const why=[];
      if(!gl)why.push('沒有戴眼鏡');if(h!=='r')why.push(h==='n'?'沒有戴帽子':'帽子不是紅色');if(bg!=='o')why.push(bg==='n'?'沒有背包包':'包包不是圓形的');
      if(!why.length){SC.mode=null;sWin();res()}else{sBad();toast('不是他！他'+why.join('，也')+'。',2400);g.style.opacity='.35'}};
  });
  bar.hidden=true;
  await say('duo','找到了！就是你，怪盜X！');
  await say('x','嗚哇！被發現了！可是我跑得比誰都快——');
  await say('sys','怪盜X一溜煙衝進古堡城牆，在窗戶之間跳來跳去！');
  await say('duo','{n}，看準了！他從窗戶探出頭的時候，點他 5 次就能抓住他！小心不要點到路人喔。');
  hideDlg();
  await whack();
  await say('sys','多叔一個飛撲——抓住了！');
  const xg=await actorIn('x',X_LOOK,900,820,1.2);
  await say('x','嗚嗚……被抓到了……');
  await say('duo','怪盜X，你為什麼要偷台灣的寶物？');
  await say('x','因為……台灣的東西都太美了。101的燈、日月潭的船、古堡的寶物……我想通通放在我家……');
  await say('duo','美麗的東西，要留給大家一起欣賞，才是真正的寶物。');
  await say('x','……對不起。我會把寶物都還回去的。');
  await say('x','哈……哈……哈啾！！');
  $('#fxL').innerHTML=`<g opacity=".95">${[[880,640,120],[980,700,100],[800,720,110],[920,560,90]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#E6E9F2"/>`).join('')}</g>`;
  await say('sys','一陣白煙冒出來——煙，英文叫 smoke（sm 開頭）。等煙散去……');
  xg.remove();$('#fxL').innerHTML='';
  await say('duo','咳咳……他又溜走了！不過，三樣寶物都保住了。');
  await say('sys','地上留著一張小紙條：「下次見！北海岸的女王頭，等著我吧～　—— 怪盜X」');
  await say('duo','{n}，你今天表現得太棒了！你是一位真正的偵探助手。');
  hideDlg();
  ending();
}
function whack(){
  return new Promise(res=>{
    setScene({id:'wall',color:'#FFE6C2',bg:()=>{let s=`<rect width="1600" height="1000" fill="#FFE6C2"/><rect x="100" y="120" width="1400" height="760" fill="#C8603F" stroke="#2A3557" stroke-width="8"/><g fill="#C8603F" stroke="#2A3557" stroke-width="6">${Array.from({length:14},(_,i)=>`<rect x="${110+i*100}" y="76" width="64" height="50"/>`).join('')}</g>`;
      WIN.forEach(([x,y])=>{s+=`<rect x="${x-110}" y="${y-150}" width="220" height="230" rx="110" fill="#3A2A2A" stroke="#2A3557" stroke-width="7"/>`});return s},spots:[]});
    const bar=$('#taskPill');bar.hidden=false;let hits=0;const upd=()=>{bar.innerHTML=`抓住怪盜X：${hits}/5<small>他探出頭的時候，快點他！</small>`};upd();
    let cur=null,timer=null,over=false;
    const pop=()=>{if(over)return;const i=Math.floor(Math.random()*WIN.length);const isX=Math.random()<.62;const [x,y]=WIN[i];
      const look=isX?X_LOOK:[CAST.deer.look,CAST.turtle.look,{k:'rabbit',shirt:'#FFB347'}][Math.floor(Math.random()*3)];
      $('#spotL').innerHTML=`<g class="spot" data-id="${isX?'X':'N'}"><g transform="translate(${x} ${y+60}) scale(.85)">${critter(look)}</g><rect class="hit" x="${x-110}" y="${y-160}" width="220" height="240"/></g>`;
      cur=isX;clearTimeout(timer);timer=setTimeout(()=>{$('#spotL').innerHTML='';setTimeout(pop,300)},1100)};
    SC.mode=(id)=>{if(id==='X'){hits++;sGood();upd();$('#spotL').innerHTML='';clearTimeout(timer);
        if(hits>=5){over=true;SC.mode=null;bar.hidden=true;setTimeout(res,400)}else setTimeout(pop,350)}
      else{sBad();toast('哎喲！那是路人啦！');$('#spotL').innerHTML='';clearTimeout(timer);setTimeout(pop,400)}};
    setTimeout(pop,600);
  });
}
const WIN=[[340,380],[800,380],[1260,380],[340,740],[800,740],[1260,740]];
function ending(){
  setCh('破案成功！');
  const stars=G.energy>=5?3:G.energy>=3?2:1;
  modal(`<div class="card cert" style="width:min(720px,100%)">
    <img src="${IMG.front}" alt="偵探多叔" style="width:150px;margin:-6px auto 0;display:block">
    <div style="letter-spacing:6px;font-weight:900;color:var(--ink2)">破案證書</div>
    <h3 style="font-size:36px;margin:6px 0">${fmt('{n}')} 偵探助手</h3>
    <p class="lead" style="margin:0">和偵探多叔一起，保護了台北101的燈、日月潭的遊船和安平古堡的寶物！</p>
    <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="stats"><div><b>${G.energy}/5</b>推理力</div><div><b>${G.badges.length}/9</b>骨頭徽章</div><div><b>${G.quests.length}/2</b>幫忙任務</div></div>
    <p class="lead">${G.badges.length<9?'還有骨頭徽章沒找到喔！再玩一次，把它們通通找出來吧。':'哇！所有骨頭徽章都找到了，你是觀察力超強的偵探！'}</p>
    <div class="story" style="text-align:left">下一案預告：怪盜X盯上了北海岸的「女王頭」……</div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn c" id="again">再玩一次</button></div></div>`,b=>{
    b.querySelector('#again').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()}});
  G.ch=5;save();
}

/* ================= boot ================= */
async function run(from){
  hud();
  if(from<=0)await prologue();
  if(from<=1)await ch1();
  if(from<=2)await ch2();
  if(from<=3)await ch3();
  await finale();
}
