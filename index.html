<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="偵探多叔">
<meta name="theme-color" content="#F3E8CF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>偵探多叔：台灣大搜查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&family=Fredoka:wght@500;600;700&family=LXGW+WenKai+TC:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="ch" id="hudCh">偵探多叔事務所</div>
    <div class="pill hudme" id="hudMe"></div>
    <div class="pill hearts" id="hudHearts" title="推理力"></div>
    <div class="pill"><span class="bone" aria-hidden="true"></span>&nbsp;<span id="hudBones">0</span>/<span id="hudBonesT">9</span></div>
    <button class="hbtn" id="nbBtn">線索板</button>
    <button class="hbtn w" id="pauseBtn" title="存檔／離開">暫停</button>
  </div>
  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet"><g id="bgL"></g><g id="spotL"></g><g id="fxL"></g></svg>
    <div class="taskpill" id="taskPill" hidden></div>
    <button class="deduce" id="deduceBtn" hidden>開始推理！</button>
    <div class="choices" id="choices" hidden></div>
    <div class="dlg" id="dlg" hidden>
      <div class="port" id="dPort"></div>
      <div class="bubble">
        <div class="nametag" id="dName"></div>
        <div class="dtext" id="dText"></div>
        <div class="dzh" id="dZh" hidden></div>
        <div class="dtools"><button class="tool" id="dZhBtn" hidden>看中文</button><button class="tool" id="dSay">唸給我聽</button><div class="next" id="dNext" hidden></div></div>
      </div>
    </div>
  </div>
</div>

<div class="title" id="title">
  <svg class="clouds" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g transform="translate(1390 760) rotate(-18)" fill="none" stroke="#DCCBA4" stroke-width="22" stroke-linecap="round"><circle r="120"/><path d="M86 86 L210 210"/></g><text x="120" y="250" font-size="300" font-weight="900" fill="#BFD0DF" transform="rotate(-12 120 250)" font-family="Fredoka,sans-serif">?</text></svg>
  <img class="hero" id="heroImg" alt="偵探多叔">
  <div class="tcard">
    <span class="eyebrow">偵探案件簿</span>
    <h1>偵探<b>多叔</b><br><i>台灣</i>大搜查</h1>
    <div class="tstripe" aria-hidden="true"><span style="background:#C86062"></span><span style="background:#D4BB49"></span><span style="background:#2B79B5"></span><span style="background:#8DB36E"></span></div>
    <p class="sub">怪盜X寄來了挑戰書！</p>
    <label for="pname">偵探助手的名字</label>
    <input id="pname" maxlength="6" placeholder="輸入你的名字" autocomplete="off">
    <div class="avbox"><div class="avprev" id="avPrev" aria-label="你的角色"></div><div><button type="button" class="btn w" id="avEdit" style="min-height:48px;font-size:18px;padding:6px 16px">設計我的角色</button></div></div>
    <div class="row">
      <button class="btn c" id="goBtn">打開案件簿</button>
      <button class="btn w" id="resBtn" hidden>從上次的章節繼續</button>
    </div>
    <button class="appbtn" id="appBtn" type="button"><span aria-hidden="true">📲</span> 把遊戲加到主畫面，變成 App</button>
  </div>
</div>

<div class="modal" id="modal" hidden><div id="mBody" style="display:contents"></div></div>
<div class="modal" id="modal2" hidden style="z-index:33"><div id="m2Body" style="display:contents"></div></div>
<button class="peekBtn" id="peekBtn" hidden>回到題目 ▶</button>

<!-- 載入順序很重要：圖片 → 引擎 → 場景 → 小遊戲 → 各案件 → 開機 -->
<script src="js/assets.js"></script>
<script src="js/engine.js"></script>
<script src="js/scenes.js"></script>
<script src="js/minigames.js"></script>
<script src="js/case1.js"></script>
<script src="js/cases.js"></script>
<script src="js/scenes2.js"></script>
<script src="js/minigames2.js"></script>
<script src="js/case2.js"></script>
<script src="js/main.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
</body>
</html>
